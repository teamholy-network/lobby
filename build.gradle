plugins {
    id 'java'
    id 'maven-publish'
    id('com.gradleup.shadow') version('9.4.2')
}

group = 'de.teamholy'
version = '2.0.0'

ext {
    coreVersion = '2.9.0'
}

repositories {
    mavenCentral()
    maven {
        name = 'spigotmc-repo'
        url = uri('https://hub.spigotmc.org/nexus/content/repositories/public/')
        metadataSources { gradleMetadata(); mavenPom(); artifact() }
        content {
            includeGroup 'net.md-5'
            includeGroup 'org.spigotmc'
        }
    }
    maven { url "https://repo.dmulloy2.net/repository/public/" }
    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }
    maven { url "https://repo.codemc.io/repository/maven-public/" }
    maven { url "https://repo.glaremasters.me/repository/concuncan/" }
    maven {
        name = 'cloudnet-releases'
        url = uri('https://repo.cloudnetservice.eu/releases/')
        metadataSources { gradleMetadata(); mavenPom(); artifact() }
        content {
            includeGroup 'de.dytanic.cloudnet'
        }
    }
    maven {
        name = 'jitpack'
        url = uri('https://jitpack.io')
        content {
            includeGroup 'com.github.azbh111'
        }
    }
    maven {
        name = 'GitHubPackagesHolyCore'
        url = uri('https://maven.pkg.github.com/teamholy-network/holy-core')
        credentials {
            username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
            password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
        }
        content {
            includeGroup 'de.teamholy'
        }
    }
    mavenLocal()
}

configurations.all {
    resolutionStrategy {
        force "org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT"
    }
}

dependencies {
    compileOnly("de.teamholy:holy-core-api:$coreVersion")
    compileOnly "de.teamholy:bukkit-core-api:${coreVersion}"
    compileOnly "de.teamholy:bukkit-markupapi:${coreVersion}"
    compileOnly 'eu.koboo:en2do:3.1.9'
    compileOnly 'net.md-5:bungeecord-api:1.19-R0.1-SNAPSHOT'
    compileOnly('org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT') {
        transitive = false
    }
    compileOnly 'com.github.azbh111:craftbukkit-1.8.8:R'
    compileOnly 'org.mongodb:mongo-java-driver:3.12.8'
    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'com.google.code.gson:gson:2.2.4'

    // lobby-specific dependencies (used by CloudCacheHandler/CloudListener, LeaderboardInventory, HologramHandler)
    compileOnly 'de.dytanic.cloudnet:cloudnet-wrapper-jvm:3.4.5-RELEASE'
    compileOnly 'de.dytanic.cloudnet:cloudnet-bridge:3.4.5-RELEASE'
    compileOnly 'org.redisson:redisson:3.19.1'
    // must be installed to mavenLocal() manually
    compileOnly 'com.gmail.filoghost.holographicdisplays:holographicdisplays-api:2.4.9'

    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.2.4'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    // release 17 statt 8: Code nutzt java.net.http und Java-16+-Syntax, Server läuft auf Java 17+
    options.release = 17
    options.encoding = 'UTF-8'
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

tasks.test {
    useJUnitPlatform()
}

publishing {
    publications {
        shadow(MavenPublication) {
            from components.shadow
            artifactId = project.name.toLowerCase()
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/teamholy-network/holy-games')
            credentials {
                username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

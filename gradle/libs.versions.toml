[versions]
teamholy        = "2.8.2"
cloudnet        = "3.4.5-RELEASE"
spigot          = "1.8.8-R0.1-SNAPSHOT"
bungeecord      = "1.21-R0.4"
brigadier       = "1.0.16-SNAPSHOT"
protocollib     = "5.3.0"
en2do           = "3.2.3"
netty           = "4.1.97.Final"
craftbukkit     = "R"
mongodb         = "3.12.8"
redisson        = "3.19.1"
slime           = "2.2.1"
holographic     = "2.4.9"
lombok          = "1.18.38"

[libraries]
# teamholy
teamholy-core-api   = { module = "de.teamholy:holy-core-api",                                          version.ref = "teamholy" }
teamholy-bukkit-api = { module = "de.teamholy:bukkit-core-api",                                        version.ref = "teamholy" }
teamholy-bungee-api = { module = "de.teamholy:bungee-core-api",                                        version.ref = "teamholy" }
teamholy-markupapi  = { module = "de.teamholy:bukkit-markupapi",                                       version.ref = "teamholy" }

# cloudnet
cloudnet-wrapper    = { module = "de.dytanic.cloudnet:cloudnet-wrapper-jvm",                           version.ref = "cloudnet" }
cloudnet-syncproxy  = { module = "de.dytanic.cloudnet:cloudnet-syncproxy",                             version.ref = "cloudnet" }
cloudnet-bridge     = { module = "de.dytanic.cloudnet:cloudnet-bridge",                                version.ref = "cloudnet" }

# minecraft
spigot-api          = { module = "org.spigotmc:spigot-api",                                            version.ref = "spigot" }
bungeecord-api      = { module = "net.md-5:bungeecord-api",                                            version.ref = "bungeecord" }
brigadier           = { module = "net.md-5:brigadier",                                                 version.ref = "brigadier" }
craftbukkit         = { module = "com.github.azbh111:craftbukkit-1.8.8",                               version.ref = "craftbukkit" }
protocollib         = { module = "com.comphenix.protocol:ProtocolLib",                                 version.ref = "protocollib" }

# data
en2do               = { module = "eu.koboo:en2do",                                                     version.ref = "en2do" }
netty-codec         = { module = "io.netty:netty-codec",                                               version.ref = "netty" }
mongodb             = { module = "org.mongodb:mongo-java-driver",                                      version.ref = "mongodb" }
redisson            = { module = "org.redisson:redisson",                                               version.ref = "redisson" }

# plugins — must be installed to mavenLocal() manually
slime-api           = { module = "com.grinderwolf:slimeworldmanager-api",                              version.ref = "slime" }
holographic-api     = { module = "com.gmail.filoghost.holographicdisplays:holographicdisplays-api",    version.ref = "holographic" }

# tooling
lombok              = { module = "org.projectlombok:lombok",                                           version.ref = "lombok" }

[bundles]
teamholy  = ["teamholy-core-api", "teamholy-bukkit-api", "teamholy-bungee-api", "teamholy-markupapi"]
cloudnet  = ["cloudnet-wrapper", "cloudnet-syncproxy", "cloudnet-bridge"]
minecraft = ["spigot-api", "bungeecord-api", "brigadier", "craftbukkit"]
